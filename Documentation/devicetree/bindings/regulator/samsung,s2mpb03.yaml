%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/samsung,s2mpb03.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPB03 camera PMIC

maintainers:
  - Miroslav Mráz <miroslav.mraz@techmania.cz>

description:
  The Samsung S2MPB03 is a camera power management IC providing seven LDO
  regulators controlled over I2C. It is found on boards such as the Samsung
  Galaxy A52 (SM7125).

properties:
  compatible:
    const: samsung,s2mpb03

  reg:
    maxItems: 1

  regulators:
    type: object
    additionalProperties: false
    description:
      List of the seven LDO regulators, named after their hardware
      counterparts ldo1 to ldo7.

    patternProperties:
      "^ldo[1-7]$":
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false

required:
  - compatible
  - reg
  - regulators

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@56 {
            compatible = "samsung,s2mpb03";
            reg = <0x56>;

            regulators {
                ldo1 {
                    regulator-min-microvolt = <1050000>;
                    regulator-max-microvolt = <1050000>;
                };

                ldo3 {
                    regulator-min-microvolt = <1800000>;
                    regulator-max-microvolt = <1800000>;
                };
            };
        };
    };
...
