%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,infracfg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek Infrastructure System Configuration Controller

maintainers:
  - Matthias Brugger <matthias.bgg@gmail.com>

description:
  The Mediatek infracfg controller provides various clocks and reset outputs
  to the system. The clock values can be found in <dt-bindings/clock/mt*-clk.h>
  and <dt-bindings/clock/mediatek,mt*-infracfg.h>, and reset values in
  <dt-bindings/reset/mt*-reset.h>, <dt-bindings/reset/mt*-resets.h> and
  <dt-bindings/reset/mediatek,mt*-infracfg.h>.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - mediatek,mt2701-infracfg
              - mediatek,mt2712-infracfg
              - mediatek,mt6735-infracfg
              - mediatek,mt6765-infracfg
              - mediatek,mt6795-infracfg
              - mediatek,mt6779-infracfg_ao
              - mediatek,mt6797-infracfg
              - mediatek,mt7622-infracfg
              - mediatek,mt7629-infracfg
              - mediatek,mt7981-infracfg
              - mediatek,mt7986-infracfg
              - mediatek,mt7988-infracfg
              - mediatek,mt8135-infracfg
              - mediatek,mt8167-infracfg
              - mediatek,mt8173-infracfg
              - mediatek,mt8183-infracfg
              - mediatek,mt8516-infracfg
          - const: syscon
          - const: simple-mfd
        minItems: 2
      - items:
          - const: mediatek,mt7623-infracfg
          - const: mediatek,mt2701-infracfg
          - const: syscon

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - mediatek,mt2701-infracfg
              - mediatek,mt2712-infracfg
              - mediatek,mt6795-infracfg
              - mediatek,mt6797-infracfg
              - mediatek,mt7622-infracfg
              - mediatek,mt7986-infracfg
              - mediatek,mt8135-infracfg
              - mediatek,mt8173-infracfg
              - mediatek,mt8183-infracfg
    then:
      required:
        - '#reset-cells'

  # The MT6797 infracfg block also hosts the on-SoC CPU SRAM LDO regulator:
  # its registers live in this block, so it is described as a child node.
  # No other infracfg variant has it.
  - if:
      properties:
        compatible:
          contains:
            const: mediatek,mt6797-infracfg
    then:
      patternProperties:
        "^regulator-":
          $ref: /schemas/regulator/mediatek,mt6797-cpu-sram.yaml#
    else:
      patternProperties:
        "^regulator-": false

unevaluatedProperties: false

examples:
  - |
    infracfg: clock-controller@10001000 {
        compatible = "mediatek,mt8173-infracfg", "syscon";
        reg = <0x10001000 0x1000>;
        #clock-cells = <1>;
        #reset-cells = <1>;
    };
