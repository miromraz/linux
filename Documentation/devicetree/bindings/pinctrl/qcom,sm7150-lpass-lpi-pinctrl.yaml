%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/qcom,sm7150-lpass-lpi-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SM7150 SoC LPASS LPI TLMM

maintainers:
  - Miroslav Mráz <mraz.miro@seznam.cz>

description:
  Top Level Mode Multiplexer pin controller in the Low Power Audio SubSystem
  (LPASS) Low Power Island (LPI) of Qualcomm SM7150 SoC.

properties:
  compatible:
    const: qcom,sm7150-lpass-lpi-pinctrl

  reg:
    items:
      - description: LPASS LPI TLMM Control and Status registers

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: core

patternProperties:
  "-state$":
    oneOf:
      - $ref: "#/$defs/qcom-sm7150-lpass-state"
      - patternProperties:
          "-pins$":
            $ref: "#/$defs/qcom-sm7150-lpass-state"
        additionalProperties: false

$defs:
  qcom-sm7150-lpass-state:
    type: object
    description:
      Pinctrl node's client devices use subnodes for desired pin configuration.
      Client device subnodes use below standard properties.
    $ref: qcom,lpass-lpi-common.yaml#/$defs/qcom-tlmm-state
    unevaluatedProperties: false

    properties:
      pins:
        description:
          List of gpio pins affected by the properties specified in this
          subnode.
        items:
          pattern: "^gpio([0-9]|1[0-9]|2[0-9]|3[0-1])$"

      function:
        enum: [ gpio, audio_ref, cdc_pdm_rx, dmic1_clk, dmic1_data, dmic2_clk,
                dmic2_data, gp_pdm, prim_mclk_a, prim_mclk_b, qca_sb_clk,
                qca_sb_data, qdss_cti, qua_mi2s_data, qua_mi2s_sclk,
                qua_mi2s_ws, sec_mi2s, slimbus_clk, slimbus_data, swr_rx_clk,
                swr_rx_data, swr_tx_clk, swr_tx_data ]
        description:
          Specify the alternative function to be configured for the specified
          pins.

allOf:
  - $ref: qcom,lpass-lpi-common.yaml#

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    lpi_tlmm: pinctrl@62b40000 {
        compatible = "qcom,sm7150-lpass-lpi-pinctrl";
        reg = <0x62b40000 0x20000>;
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&lpi_tlmm 0 0 32>;

        tx_swr_active: tx-swr-active-state {
            clk-pins {
                pins = "gpio18";
                function = "swr_tx_clk";
                drive-strength = <2>;
                slew-rate = <1>;
                bias-disable;
            };

            data-pins {
                pins = "gpio19", "gpio20";
                function = "swr_tx_data";
                drive-strength = <2>;
                slew-rate = <1>;
                bias-bus-hold;
            };
        };
    };
