%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/onnn,lc898219xi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ON Semiconductor LC898219XI Voice Coil Motor (VCM) Lens

maintainers:
  - Vasiliy Doylov <nekocwd@mainlining.org>

description:
  The LC898219XI is a camera lens voice coil motor driver with an internal
  DAC, controlled over I2C. It is used to move the focus lens in a camera
  module.

properties:
  compatible:
    const: onnn,lc898219xi

  reg:
    maxItems: 1

  vdd-supply:
    description: Digital core voltage supply.

  vio-supply:
    description: I/O voltage supply.

  vana-supply:
    description: Motor (analog) voltage supply.

required:
  - compatible
  - reg
  - vdd-supply
  - vio-supply
  - vana-supply

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera-lens@72 {
            compatible = "onnn,lc898219xi";
            reg = <0x72>;
            vdd-supply = <&camera_ldo>;
            vio-supply = <&slg51000_ldo7>;
            vana-supply = <&slg51000_ldo3>;
        };
    };
