%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/planet,gemini-pda-nt36672.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Planet Gemini PDA NT36672 DSI Panel

maintainers:
  - Julien Etienne <julien.etienne@gmail.com>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: planet,gemini-pda-nt36672

  reg:
    maxItems: 1
    description: DSI virtual channel

  avdd-supply:
    description: Positive analog panel supply (bias OUTP rail)

  avee-supply:
    description: Negative analog panel supply (bias OUTN rail)

  reset-gpios: true
  backlight: true
  port: true

required:
  - compatible
  - reg
  - avdd-supply
  - avee-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "planet,gemini-pda-nt36672";
            reg = <0>;
            reset-gpios = <&pio 180 GPIO_ACTIVE_HIGH>;
            avdd-supply = <&reg_lcd_bias_outp>;
            avee-supply = <&reg_lcd_bias_outn>;
            backlight = <&backlight>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi0_out_ep>;
                };
            };
        };
    };
