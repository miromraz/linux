%YAML 1.2
---
$id: http://devicetree.org/schemas/input/ti,drv2624.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments DRV2624 haptic driver

maintainers:
  - miromraz <mraz.miro@seznam.cz>

description:
  The Texas Instruments DRV2624 is a haptic driver for linear resonant
  actuators (LRAs) and eccentric rotating mass (ERM) motors with an I2C
  control interface, an internal RAM waveform sequencer and a real-time
  playback (RTP) input.

allOf:
  - $ref: /schemas/input/input.yaml#

properties:
  compatible:
    const: ti,drv2624

  reg:
    maxItems: 1

  enable-gpios:
    description: Active-high enable pin. The chip enters ultra-low-power
      shutdown when this pin is deasserted.
    maxItems: 1

  interrupts:
    description: Optional. The DRV2624 IRQ pin is asserted on
      diagnostic faults and waveform-completion events.
    maxItems: 1

  vdd-supply:
    description: Power supply to the chip (1.8 V to 3.6 V).

  ti,actuator:
    description: Actuator type connected to the driver.
    enum: [lra, erm]
    default: lra

  vib-rated-mv:
    description: |
      Rated voltage of the actuator, in millivolts, programmed into
      RATED_VOLTAGE (0x1F). Left at the chip reset default when omitted.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1

  vib-overdrive-mv:
    description: |
      Overdrive clamp voltage of the actuator, in millivolts, programmed
      into OD_CLAMP (0x20). This is the full-scale reference for the
      open-loop drive. Left at the chip reset default when omitted.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1

  ti,lra-frequency-hz:
    description: Resonant frequency of the LRA, in Hz. Ignored for ERM.
    minimum: 50
    maximum: 500
    default: 205

  ti,open-loop-frequency-hz:
    description: |
      Frequency at which the LRA is driven in open loop, in Hz. Defaults
      to the resonant frequency (ti,lra-frequency-hz) when omitted; set it
      when the actuator is tuned to run off resonance. Ignored for ERM.
    minimum: 50
    maximum: 500

  ti,rtp-open-loop-frequency-hz:
    description: |
      Open-loop drive frequency, in Hz, used for the sustained real-time
      playback (RTP) buzz, which may run at a different frequency than the
      click. Defaults to ti,open-loop-frequency-hz when omitted. Ignored
      for ERM.
    minimum: 50
    maximum: 500

  ti,autocal-comp:
    description: |
      Optional factory autocal compensation. The driver writes these two
      raw calibration bytes to A_CAL_COMP (0x21) and A_CAL_BEMF (0x22) at
      init time. If omitted, the chip's internal autocal default is used.
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 2
    maxItems: 2

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        haptic@5a {
            compatible = "ti,drv2624";
            reg = <0x5a>;
            enable-gpios = <&tlmm 11 GPIO_ACTIVE_HIGH>;
            vdd-supply = <&vreg_haptic>;
            ti,actuator = "lra";
            ti,lra-frequency-hz = <205>;
            vib-rated-mv = <2243>;
            vib-overdrive-mv = <3416>;
        };
    };
