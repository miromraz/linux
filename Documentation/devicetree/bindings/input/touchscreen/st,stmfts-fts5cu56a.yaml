%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/st,stmfts-fts5cu56a.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics FTS5CU56A touchscreen controller

maintainers:
  - Miroslav Mráz <miroslav.mraz@techmania.cz>

description:
  The FTS5CU56A is an I2C capacitive multi-touch controller found on the
  Samsung Galaxy A52 (a52q) and similar devices.

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: st,stmfts_fts5cu56a

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vdd-supply:
    description: Digital power supply (1.8V).

  avdd-supply:
    description: Analog power supply (3.0V).

required:
  - compatible
  - reg
  - interrupts
  - vdd-supply
  - avdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@49 {
            compatible = "st,stmfts_fts5cu56a";
            reg = <0x49>;
            interrupt-parent = <&tlmm>;
            interrupts = <9 IRQ_TYPE_LEVEL_LOW>;
            vdd-supply = <&vreg_l10a_1p8>;
            avdd-supply = <&vreg_l7c_3p0>;
        };
    };
...
