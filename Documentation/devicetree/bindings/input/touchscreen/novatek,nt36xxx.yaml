%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/novatek,nt36xxx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT36772 touchscreen controller

maintainers:
  - Julien Etienne <julien.etienne@gmail.com>

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: novatek,nt36772-ts

  reg:
    const: 0x62

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vcc-supply:
    description:
      Analog supply. Optional because on some boards (e.g. the Planet Computers
      Gemini PDA) the controller shares always-on panel rails that are not
      individually switchable from this device.

  iovcc-supply:
    description:
      I/O supply. Optional for the same reason as vcc-supply.

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@62 {
            compatible = "novatek,nt36772-ts";
            reg = <0x62>;
            interrupts-extended = <&gpio 85 IRQ_TYPE_EDGE_RISING>;
            reset-gpios = <&gpio 68 GPIO_ACTIVE_HIGH>;
        };
    };
...
