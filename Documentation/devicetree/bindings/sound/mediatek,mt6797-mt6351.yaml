%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt6797-mt6351.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 with MT6351 CODEC sound card

maintainers:
  - Miroslav Mraz <miroslav.mraz@techmania.cz>

properties:
  compatible:
    const: mediatek,mt6797-mt6351-sound

  mediatek,platform:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The phandle of the MT6797 AFE platform.

  mediatek,audio-codec:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The phandle of the MT6351 audio codec.

  mediatek,accdet:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The phandle of the MT6351 ACCDET node, to enable headset plug and
      button detection through a headset jack.

  aux-devs:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      List of phandles of auxiliary devices, such as analog speaker
      amplifiers fed by the MT6351 outputs.
    items:
      maxItems: 1

  audio-routing:
    $ref: /schemas/types.yaml#/definitions/non-unique-string-array
    description:
      A list of the connections between audio components. Each entry is a
      pair of strings, the first being the connection's sink, the second
      being the connection's source.

required:
  - compatible
  - mediatek,platform
  - mediatek,audio-codec

additionalProperties: false

examples:
  - |
    sound {
        compatible = "mediatek,mt6797-mt6351-sound";
        mediatek,platform = <&afe>;
        mediatek,audio-codec = <&mt6351_codec>;
        mediatek,accdet = <&accdet>;
        aux-devs = <&speaker_amp>;
        audio-routing = "Speaker Amp IN", "LINEOUT L";
    };
