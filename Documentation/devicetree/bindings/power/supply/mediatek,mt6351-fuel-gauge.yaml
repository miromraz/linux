%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/mediatek,mt6351-fuel-gauge.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6351 PMIC fuel gauge

maintainers:
  - Miroslav Mraz <miroslav.mraz@techmania.cz>

description:
  The MT6351 PMIC integrates a hardware fuel-gauge ADC (FGADC) that measures
  the battery current through an external sense resistor. Together with the
  battery voltage read from the PMIC AUXADC it provides battery state-of-charge
  reporting. The fuel gauge is a sub-function of the PMIC and is described as a
  child of the PMIC node.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: mediatek,mt6351-fuel-gauge

  io-channels:
    maxItems: 1
    description:
      AUXADC channel measuring the battery voltage. On power-path designs this
      is the ISENSE channel (battery side of the external charger).

  io-channel-names:
    const: vbat

  shunt-resistor-micro-ohms:
    description:
      Value of the FGADC battery current sense resistor. Includes any gauge
      calibration gain correction.

  monitored-battery:
    description:
      phandle to a simple-battery node providing the ocv-capacity-table,
      internal resistance and constant-charge voltage used to convert the
      current and voltage readings into a state of charge.

  power-supplies: true

required:
  - compatible
  - io-channels
  - io-channel-names
  - shunt-resistor-micro-ohms
  - monitored-battery

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/iio/adc/mediatek,mt6351-auxadc.h>

    pmic {
        pmic_adc: adc {
            compatible = "mediatek,mt6351-auxadc";
            #io-channel-cells = <1>;
        };

        fuel-gauge {
            compatible = "mediatek,mt6351-fuel-gauge";
            io-channels = <&pmic_adc MT6351_AUXADC_ISENSE>;
            io-channel-names = "vbat";
            shunt-resistor-micro-ohms = <8696>;
            monitored-battery = <&battery>;
            power-supplies = <&charger>;
        };
    };
...
