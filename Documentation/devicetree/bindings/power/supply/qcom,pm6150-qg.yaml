%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pm6150-qg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PMIC QGauge (QG) fuel gauge

maintainers:
  - Danila Tikhonov <danila@jiaxyga.com>

description:
  QGauge is a battery fuel-gauge hardware block found in some Qualcomm PMICs
  such as the PM6150. It samples pack voltage and current and stores its
  learned state in a companion SDAM. The driver derives capacity from the
  monitored-battery voltage range and reports charge state from the wired
  charger power supply.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: qcom,pm6150-qg

  reg:
    maxItems: 1

  io-channels:
    maxItems: 1

  io-channel-names:
    items:
      - const: batt-therm

  nvmem:
    description: SDAM the fuel gauge keeps its learned state in
    maxItems: 1

  monitored-battery: true

  power-supplies: true

required:
  - compatible
  - reg
  - io-channels
  - io-channel-names
  - nvmem
  - monitored-battery

additionalProperties: false

examples:
  - |
    #include <dt-bindings/iio/qcom,spmi-vadc.h>
    pmic {
      #address-cells = <1>;
      #size-cells = <0>;

      battery@4800 {
        compatible = "qcom,pm6150-qg";
        reg = <0x4800>;

        io-channels = <&pm6150_adc ADC5_BAT_THERM_100K_PU>;
        io-channel-names = "batt-therm";

        nvmem = <&pm6150_qg_sdam>;

        monitored-battery = <&battery>;
        power-supplies = <&pm6150_charger>;
      };
    };
