%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/awinic,aw9120.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW9120 20-channel LED controller

maintainers:
  - Miroslav Mraz <miroslav.mraz@techmania.cz>

description:
  The AW9120 is an I2C constant-current LED controller with 20 individually
  controlled outputs (0-19). Outputs wired together as an RGB LED are described
  by a multi-led node whose led sub-nodes select the colour component; remaining
  outputs are described by individual led nodes. In both cases the unit address
  of a (sub-)node that maps to an output is that output's index.

properties:
  compatible:
    const: awinic,aw9120

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  enable-gpios:
    description: GPIO connected to the PDN (power-down) pin.
    maxItems: 1

  vcc-supply:
    description: Regulator supplying the controller.

patternProperties:
  "^multi-led@[0-9a-f]+$":
    type: object
    $ref: leds-class-multicolor.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        description: Lowest output index of the RGB group.
        minimum: 0
        maximum: 19

      "#address-cells":
        const: 1

      "#size-cells":
        const: 0

    patternProperties:
      "^led@[0-9a-f]+$":
        type: object
        $ref: common.yaml#
        unevaluatedProperties: false

        properties:
          reg:
            description: Index of the LED output.
            minimum: 0
            maximum: 19

        required:
          - reg
          - color

    required:
      - reg
      - color
      - "#address-cells"
      - "#size-cells"

  "^led@[0-9a-f]+$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        description: Index of the LED output.
        minimum: 0
        maximum: 19

    required:
      - reg

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@2c {
            compatible = "awinic,aw9120";
            reg = <0x2c>;
            #address-cells = <1>;
            #size-cells = <0>;
            enable-gpios = <&pio 245 GPIO_ACTIVE_HIGH>;

            multi-led@0 {
                reg = <0>;
                color = <LED_COLOR_ID_RGB>;
                function = LED_FUNCTION_INDICATOR;
                #address-cells = <1>;
                #size-cells = <0>;

                led@0 {
                    reg = <0>;
                    color = <LED_COLOR_ID_RED>;
                };

                led@1 {
                    reg = <1>;
                    color = <LED_COLOR_ID_GREEN>;
                };

                led@2 {
                    reg = <2>;
                    color = <LED_COLOR_ID_BLUE>;
                };
            };

            led@3 {
                reg = <3>;
                color = <LED_COLOR_ID_WHITE>;
                function = LED_FUNCTION_STATUS;
            };
        };
    };

...
